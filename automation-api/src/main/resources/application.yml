server:
  port: ${PORT:8088}

spring:
  application:
    name: facture-automation-api
  datasource:
    url: ${SPAT_RO_JDBC_URL:}
    username: ${SPAT_RO_DB_USER:}
    password: ${SPAT_RO_DB_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver
  sql:
    init:
      mode: never

spat:
  readonly:
    enabled: ${SPAT_RO_DB_ENABLED:false}
  audit:
    enabled: ${SPAT_API_AUDIT_ENABLED:false}
    jdbc-url: ${SPAT_API_AUDIT_JDBC_URL:}
    username: ${SPAT_API_AUDIT_DB_USER:}
    password: ${SPAT_API_AUDIT_DB_PASSWORD:}

logging:
  level:
    org.springframework.jdbc.core: INFO
