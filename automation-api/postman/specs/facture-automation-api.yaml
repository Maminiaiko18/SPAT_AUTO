openapi: 3.0.3
info:
  title: SPAT Facture Automation API
  version: 0.1.0
  description: >-
    Contrôle en lecture seule d'une proposition de facture fournisseur par
    rapport à une ligne de bon de livraison SPAT.
servers:
  - url: http://localhost:8088
    description: Valeur locale par défaut, surchargeable par un environnement Postman
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Vérifier que le service répond
      responses:
        '200':
          description: Service disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: UP
                service: facture-automation-api
  /api/v1/ready:
    get:
      operationId: checkOracleReadiness
      summary: Vérifier que l’API peut lire Oracle SPAT_RO
      responses:
        '200':
          description: L’API et Oracle sont prêts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: Oracle SPAT_RO est absent ou injoignable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /api/v1/tiers/doublons:
    get:
      operationId: findTiersDoublonsByQuery
      summary: Rechercher les tiers existants en doublon (lecture seule)
      description: >-
        Compare le nom, le NIF et le STAT fournis aux lignes de TIERS, hors ID
        exclu. Le nom est comparé sans tenir compte de la casse. Aucune écriture
        dans SPAT.
      parameters:
        - name: nom
          in: query
          schema: {type: string}
        - name: nif
          in: query
          schema: {type: string}
        - name: stat
          in: query
          schema: {type: string}
        - name: idExclu
          in: query
          description: ID du tiers venant d'être créé, exclu de la recherche.
          schema: {type: string}
      responses:
        '200':
          description: Recherche effectuée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoublonsResponse'
              example:
                statut: A_VERIFIER
                doublons:
                  - id: TIE-DEMO-1
                    nom: Societe Exemple
        '503':
          description: Connexion Oracle lecture seule non activée ou indisponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableResponse'
              example:
                erreur: Oracle SPAT_RO non configuré
    post:
      operationId: findTiersDoublons
      summary: Rechercher les tiers existants en doublon (lecture seule)
      description: >-
        Même contrôle que le GET, avec les critères dans le corps JSON. Utilisé
        par le workflow n8n de contrôle après enregistrement d'un tiers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TiersDoublonsRequest'
            example:
              nom: Societe Exemple
              nif: '1234567890'
              stat: '12345678901234567'
              idExclu: TIE-DEMO-2
      responses:
        '200':
          description: Recherche effectuée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoublonsResponse'
              examples:
                doublon:
                  value:
                    statut: A_VERIFIER
                    doublons:
                      - id: TIE-DEMO-1
                        nom: Societe Exemple
                sansDoublon:
                  value:
                    statut: VALIDE
                    doublons: []
        '400':
          description: Corps JSON invalide.
        '503':
          description: Connexion Oracle lecture seule non activée ou indisponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableResponse'
              example:
                erreur: Oracle SPAT_RO non configuré
  /api/v1/utilisateurs/doublons:
    get:
      operationId: findUtilisateursDoublonsByQuery
      summary: Rechercher les utilisateurs existants avec le même login (lecture seule)
      parameters:
        - name: loginuser
          in: query
          schema: {type: string}
        - name: refuser
          in: query
          description: REFUSER de l'utilisateur venant d'être créé, exclu de la recherche.
          schema: {type: string}
      responses:
        '200':
          description: Recherche effectuée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoublonsResponse'
              example:
                statut: A_VERIFIER
                doublons:
                  - id: '2100'
                    nom: cdev
        '503':
          description: Connexion Oracle lecture seule non activée ou indisponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableResponse'
    post:
      operationId: findUtilisateursDoublons
      summary: Rechercher les utilisateurs existants avec le même login (lecture seule)
      description: >-
        Même contrôle que le GET, avec les critères dans le corps JSON. Utilisé
        par le workflow n8n de contrôle après enregistrement d'un utilisateur.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UtilisateurDoublonsRequest'
            example:
              loginuser: test.recette
              refuser: '2101'
      responses:
        '200':
          description: Recherche effectuée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoublonsResponse'
              examples:
                doublon:
                  value:
                    statut: A_VERIFIER
                    doublons:
                      - id: '2100'
                        nom: cdev
                sansDoublon:
                  value:
                    statut: VALIDE
                    doublons: []
        '400':
          description: Corps JSON invalide.
        '503':
          description: Connexion Oracle lecture seule non activée ou indisponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableResponse'
  /api/v1/factures-fournisseurs/validation:
    post:
      operationId: validateSupplierInvoice
      summary: Contrôler une proposition de facture sans écrire dans SPAT
      description: >-
        Compare les lignes à la vue Oracle de reste à facturer. Les quantités
        et prix sont comparés sans tolérance métier implicite. Un résultat
        A_CORRIGER est un contrôle effectué, pas une erreur HTTP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationRequest'
            example:
              idFactureFournisseur: FF-DEMO
              idBonLivraison: BL-DEMO
              idBonCommande: BC-DEMO
              lignes:
                - idLigneLivraison: BLF-DEMO
                  quantite: 2
                  prixUnitaire: 1500
      responses:
        '200':
          description: Contrôle effectué, résultat par ligne inclus.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
              examples:
                valide:
                  value:
                    statut: VALIDE
                    idBonLivraison: BL-DEMO
                    idBonCommande: BC-DEMO
                    lignes:
                      - idLigneLivraison: BLF-DEMO
                        valide: true
                        ecarts: []
                aCorriger:
                  value:
                    statut: A_CORRIGER
                    idBonLivraison: BL-DEMO
                    idBonCommande: BC-DEMO
                    lignes:
                      - idLigneLivraison: BLF-DEMO
                        valide: false
                        ecarts:
                          - Ligne introuvable pour ce bon de livraison et ce bon de commande.
        '400':
          description: Corps JSON invalide ou champs obligatoires non conformes.
        '503':
          description: Connexion Oracle lecture seule non activée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableResponse'
              example:
                erreur: Oracle SPAT_RO non configuré
components:
  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: UP
        service:
          type: string
          example: facture-automation-api
    ReadinessResponse:
      type: object
      required: [status, service, database, oracleCode]
      properties:
        status:
          type: string
          enum: [UP, DOWN]
        service:
          type: string
        database:
          type: string
        oracleCode:
          type: string
    ValidationRequest:
      type: object
      required: [idBonLivraison, idBonCommande, lignes]
      properties:
        idFactureFournisseur:
          type: string
          description: >-
            Facture en cours de validation, exclue du cumul déjà facturé.
            Absente ou vide, le contrôle conserve le comportement existant.
        idBonLivraison:
          type: string
          minLength: 1
        idBonCommande:
          type: string
          minLength: 1
        lignes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProposedLine'
    ProposedLine:
      type: object
      required: [idLigneLivraison, quantite, prixUnitaire]
      properties:
        idLigneLivraison:
          type: string
          minLength: 1
        quantite:
          type: number
          minimum: 0
          exclusiveMinimum: true
        prixUnitaire:
          type: number
          minimum: 0
          exclusiveMinimum: true
    ValidationResponse:
      type: object
      required: [statut, idBonLivraison, idBonCommande, lignes]
      properties:
        statut:
          type: string
          enum: [VALIDE, A_CORRIGER]
        idBonLivraison:
          type: string
        idBonCommande:
          type: string
        lignes:
          type: array
          items:
            $ref: '#/components/schemas/LineResult'
    LineResult:
      type: object
      required: [idLigneLivraison, valide, ecarts]
      properties:
        idLigneLivraison:
          type: string
        valide:
          type: boolean
        ecarts:
          type: array
          items:
            type: string
    TiersDoublonsRequest:
      type: object
      properties:
        nom:
          type: string
          description: >-
            Nom du tiers créé. Comparé sans tenir compte de la casse et des
            espaces en début/fin.
        nif:
          type: string
          description: NIF du tiers créé.
        stat:
          type: string
          description: STAT du tiers créé.
        idExclu:
          type: string
          description: >-
            ID du tiers venant d'être créé. Ce tiers n'est jamais retourné
            comme doublon de lui-même.
    UtilisateurDoublonsRequest:
      type: object
      properties:
        loginuser:
          type: string
          description: Login de l'utilisateur créé.
        refuser:
          type: string
          description: >-
            REFUSER de l'utilisateur créé. Cet utilisateur n'est jamais
            retourné comme doublon de lui-même.
    DoublonsResponse:
      type: object
      required: [statut, doublons]
      properties:
        statut:
          type: string
          enum: [VALIDE, A_VERIFIER]
          description: A_VERIFIER si au moins un doublon a été trouvé.
        doublons:
          type: array
          items:
            $ref: '#/components/schemas/Doublon'
    Doublon:
      type: object
      required: [id, nom]
      properties:
        id:
          type: string
          description: ID du tiers (TIERS.ID) ou REFUSER de l'utilisateur.
        nom:
          type: string
          description: NOM du tiers ou NOMUSER de l'utilisateur.
    ServiceUnavailableResponse:
      type: object
      required: [erreur]
      properties:
        erreur:
          type: string
